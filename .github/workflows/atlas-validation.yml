name: Atlas Vivo validation
on:
  push:
    branches:
      - main
      - feature/visual-atlas-v2
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout review source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check runtime
        run: node --version
      - name: Validate browser modules and API syntax
        run: |
          node --check visual-core.js
          node --check visual-composer.js
          node --check visual-app.js
          node --check spatial-core.js
          node --check spatial-composer.js
          node --check immersive-atlas.js
          node --check composer.js
          node --check api/craft.js
      - name: Validate Craft atlas parser, navigation, and safety
        run: npm test
