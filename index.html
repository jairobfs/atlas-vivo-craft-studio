<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071923"><title>ATLAS VIVO · Craft Studio</title><style>
:root{color-scheme:dark;--bg:#071923;--panel:#102d3c;--side:#0e2631;--ink:#e7f5ef;--muted:#afc7c5;--teal:#56c9c7;--line:#2c4d58}body.light{color-scheme:light;--bg:#f5faf8;--panel:#fff;--side:#e6f3f0;--ink:#183b3a;--muted:#526c6a;--teal:#007d87;--line:#cde1dc}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}h1{font-size:clamp(28px,4vw,42px);letter-spacing:-1.4px;line-height:1.12}h2{letter-spacing:-.4px}a{color:var(--teal)}button,input,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.5}.app{max-width:1350px;margin:auto;min-height:100dvh;display:grid;grid-template-columns:235px 1fr}aside{padding:26px 16px;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:22px}.logo{font-size:25px;font-weight:900;letter-spacing:-1px}.logo span{color:var(--teal)}.eyebrow{font-size:11px;letter-spacing:1.6px;color:var(--teal);font-weight:800;text-transform:uppercase}nav{display:grid;gap:6px}nav button{background:none;border:0;color:var(--muted);padding:12px;border-radius:10px;text-align:left;font-weight:700}nav button.active{background:var(--panel);color:var(--teal)}.foot{margin-top:auto;color:var(--muted);font-size:12px}main{padding:27px 32px 90px;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:27px;color:var(--muted);font-size:13px}.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:11px;padding:10px 15px;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.btn.primary{background:#007d87;border-color:transparent;color:white}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.hero{padding:29px;background:radial-gradient(circle at 85% 0%,#18b9ae2d,transparent 55%),var(--panel);border:1px solid var(--line);border-radius:20px;margin-bottom:17px}.hero p,.muted{color:var(--muted)}.hero p{max-width:690px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:18px;color:var(--ink);text-align:left;min-height:145px}.card h3{font-size:16px;line-height:1.3;margin:13px 0 7px}.card p{font-size:12px;color:var(--muted);margin:0}.panel{padding:19px;background:var(--panel);border:1px solid var(--line);border-radius:16px;margin:15px 0}.field{width:100%;padding:13px;border-radius:10px;background:var(--panel);border:1px solid var(--line);color:var(--ink);margin:7px 0 15px;outline-color:var(--teal)}textarea.field{min-height:130px;resize:vertical}.reading{max-width:900px}.block{padding:12px 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere}.block p{margin:0;white-space:pre-wrap}.block h2{color:var(--teal)}.block img{display:block;max-width:100%;max-height:550px;object-fit:contain;border-radius:12px}.mapitem{padding:14px;border-left:3px solid var(--teal);background:var(--side);border-radius:9px;margin:9px 0}.callout{padding:14px;background:var(--side);border-left:3px solid var(--teal)}.login{max-width:450px;margin:7vh auto}.bottom{display:none}.hide{display:none!important}.toast{position:fixed;bottom:20px;right:20px;max-width:330px;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:10px}
@media(max-width:750px){.app{display:block}aside{display:none}main{padding:20px 16px 100px}.hero{padding:22px}.grid{grid-template-columns:1fr 1fr;gap:9px}.card{padding:13px;min-height:134px}.card h3{font-size:14px}.panel{padding:16px}.bottom{display:flex;position:fixed;bottom:0;left:0;right:0;justify-content:space-around;background:var(--side);border-top:1px solid var(--line);padding:11px 6px calc(11px + env(safe-area-inset-bottom))}.bottom button{border:0;background:none;color:var(--muted);font-size:12px;font-weight:700}.bottom button.active{color:var(--teal)}}@media(max-width:340px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="app"><aside><div><div class="logo">ATLAS <span>VIVO</span></div><div class="eyebrow">CRAFT STUDIO · COLORHUB</div></div><nav class="menu" id="side"></nav><div class="foot">Craft: conteúdos e figuras<br>GitHub: código<br>Vercel: publicação</div></aside><main><header class="top"><span id="crumb">Atlas Vivo / Início</span><div class="row"><button class="btn" id="theme">◐</button><button class="btn hide" id="logout">Sair</button></div></header><div id="screen"></div></main></div><nav class="bottom menu" id="bottom"></nav><div class="toast hide" id="toast"></div>
<script>
const one=s=>document.querySelector(s),many=s=>Array.from(document.querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safe=s=>{try{let u=new URL(s);return u.protocol==='https:'||u.protocol==='http:'?u.href:''}catch{return ''}};
let st={auth:false,tab:'home',docs:[],doc:null,id:'',info:{},query:'',mode:'read'};
const list=x=>Array.isArray(x)?x:Array.isArray(x?.items)?x.items:Array.isArray(x?.data)?x.data:Array.isArray(x?.documents)?x.documents:Array.isArray(x?.data?.items)?x.data.items:[];
const label=x=>String(x?.title?.markdown||x?.title||x?.markdown||x?.name||x?.text?.value||'Sem título').replace(/^#{1,4}\s+/,'');
const key=x=>x?.rootBlockId||x?.id||x?.documentId||'';
async function api(op,args={},payload){let u=new URL('/api/craft',location.href);u.searchParams.set('op',op);Object.entries(args).forEach(([k,v])=>u.searchParams.set(k,v));let r=await fetch(u,{method:payload?'POST':'GET',headers:payload?{'Content-Type':'application/json'}:{},credentials:'same-origin',body:payload?JSON.stringify(payload):undefined});let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Falha na requisição');return d}
function toast(t){let e=one('#toast');e.textContent=t;e.classList.remove('hide');setTimeout(()=>e.classList.add('hide'),3500)}
const nav=[['home','Início'],['library','Biblioteca'],['map','Mapa'],['studio','Estúdio']];
function menu(){for(let id of ['side','bottom'])one('#'+id).innerHTML=nav.map(([v,s])=>'<button class="'+(st.tab===v?'active':'')+'" data-nav="'+v+'">'+s+'</button>').join('');many('[data-nav]').forEach(b=>b.onclick=()=>go(b.dataset.nav))}
function go(v){st.tab=v;menu();one('#crumb').textContent='Atlas Vivo / '+({home:'Início',library:'Biblioteca',map:'Mapa',studio:'Estúdio',reader:'Leitor'}[v]||v);render();scrollTo(0,0)}
function card(d){return '<button class="card" data-doc="'+esc(key(d))+'"><div class="eyebrow">CRAFT · NOTA</div><h3>'+esc(label(d))+'</h3><p>Explorar blocos, fontes e figuras</p></button>'}
function bind(){many('[data-doc]').forEach(b=>b.onclick=()=>openDoc(b.dataset.doc))}
function home(){one('#screen').innerHTML='<div class="hero"><div class="eyebrow">ATLAS VIVO · UNIVERSO</div><h1>Você edita no Craft.<br>O atlas ganha vida aqui.</h1><p>Transforme suas notas médicas em interfaces de leitura e mapas. O Craft continua sendo seu editor visual sem código.</p><div class="row"><button id="explore" class="btn primary">Explorar biblioteca →</button><button id="sync" class="btn">Atualizar Craft</button></div></div><div class="panel"><div class="eyebrow">DOCUMENTOS DISPONÍVEIS</div><h2>'+st.docs.length+' notas conectadas</h2><p class="muted">Conteúdo original preservado no Craft</p></div><h2>Explore seus documentos</h2><div class="grid">'+st.docs.slice(0,8).map(card).join('')+'</div>';one('#explore').onclick=()=>go('library');one('#sync').onclick=sync;bind()}
function library(){let docs=st.docs.filter(d=>label(d).toLowerCase().includes(st.query.toLowerCase()));one('#screen').innerHTML='<div class="eyebrow">BIBLIOTECA VIVA</div><h1>Documentos Craft</h1><div class="row"><button class="btn" id="sync">Sincronizar</button><span class="muted">'+docs.length+' documentos</span></div><input class="field" id="search" placeholder="Pesquisar por título..." value="'+esc(st.query)+'"><div class="grid" id="cards">'+docs.map(card).join('')+'</div>';one('#sync').onclick=sync;one('#search').oninput=e=>{st.query=e.target.value;one('#cards').innerHTML=st.docs.filter(d=>label(d).toLowerCase().includes(st.query.toLowerCase())).map(card).join('');bind()};bind()}
function flatten(o,arr){if(!o||typeof o!=='object')return;arr.push(o);(o.content||o.children||o.blocks||[]).forEach(x=>flatten(x,arr))}
function content(){let a=[];let root=list(st.doc);if(!root.length)root=[st.doc?.data||st.doc];root.forEach(x=>flatten(x,a));return a}
function craftLink(id){let space=st.info?.space?.id||st.info?.spaceId||st.info?.data?.space?.id;return space?'craftdocs://open?spaceId='+encodeURIComponent(space)+'&blockId='+encodeURIComponent(id):''}
function block(b){let m=String(b.markdown||b.text?.value||'').trim(),u=safe(b.url||b.assetUrl||b.image?.url||b.source?.url||'');if(b.type==='image')return u?'<img src="'+esc(u)+'" loading="lazy" alt="Imagem do Craft">':'<div class="callout">Imagem disponível no documento original</div>';if(b.type==='table')return '<div class="callout">Tabela original disponível no Craft</div>';if(!m)return '';let img=/^!\[([^\]]*)\]\((https?:\/\/[^)]+)\)/.exec(m);if(img&&safe(img[2]))return '<img src="'+esc(img[2])+'" loading="lazy" alt="'+esc(img[1])+'">';if(/^h[1-4]$/.test(b.textStyle||'')||/^#{1,4}\s/.test(m))return '<h2>'+esc(m.replace(/^#{1,4}\s+/,''))+'</h2>';if(m.includes('<callout>'))return '<div class="callout">'+esc(m.replace(/<\/?callout>/g,''))+'</div>';return '<p>'+esc(m)+'</p>'}
function reader(){let a=content(),root=a[0]||{},parts=a.slice(1),link=craftLink(root.id||st.id);one('#screen').innerHTML='<div class="reading"><div class="eyebrow">LEITOR · FONTE CRAFT</div><h1>'+esc(label(root))+'</h1><p class="muted">'+parts.length+' blocos encontrados</p><div class="row"><button class="btn '+(st.mode==='read'?'primary':'')+'" id="read">Leitura</button><button class="btn '+(st.mode==='map'?'primary':'')+'" id="map">Mapa</button><button class="btn" id="refresh">Atualizar</button>'+(link?'<a class="btn primary" href="'+esc(link)+'">Editar no Craft →</a>':'')+'</div><article class="panel">'+(st.mode==='read'?parts.map(x=>'<div class="block">'+block(x)+'</div>').join(''):parts.filter(x=>/^h[1-4]$/.test(x.textStyle||'')||/^#{1,4}\s/.test(x.markdown||'')).map(x=>'<div class="mapitem">'+esc(label(x))+'</div>').join(''))+'</article><p class="muted">Algumas tabelas ricas e whiteboards permanecem no editor original Craft.</p></div>';one('#read').onclick=()=>{st.mode='read';reader()};one('#map').onclick=()=>{st.mode='map';reader()};one('#refresh').onclick=()=>openDoc(st.id)}
function map(){if(st.doc){st.mode='map';go('reader');return}one('#screen').innerHTML='<div class="hero"><div class="eyebrow">MAPAS VISUAIS</div><h1>Um mapa nasce da organização das suas notas.</h1><p>Abra um documento e escolha Mapa para visualizar seus tópicos e a sequência de estudo.</p><button id="browse" class="btn primary">Abrir biblioteca →</button></div>';one('#browse').onclick=()=>go('library')}
function studio(){one('#screen').innerHTML='<div class="eyebrow">EDITORIAL SEM CÓDIGO</div><h1>Criar conteúdo no Craft</h1><p class="muted">Crie um documento básico aqui ou use os recursos visuais completos do editor Craft.</p><div class="panel"><label>Título</label><input id="title" class="field" placeholder="Ex.: Artrite séptica · atlas"><label>Texto inicial</label><textarea class="field" id="body" placeholder="Escreva seu primeiro conceito..."></textarea><button class="btn primary" id="create">Criar nota</button><p id="result" class="muted"></p></div>';one('#create').onclick=async()=>{let b=one('#create');b.disabled=true;try{let result=await api('create',{}, {title:one('#title').value});let d=list(result)[0]||result.data||result,id=key(d);if(one('#body').value.trim()&&id)await api('append',{}, {documentId:id,markdown:one('#body').value});await sync();go('library');toast('Nota criada no Craft')}catch(e){one('#result').textContent=e.message}finally{b.disabled=false}}}
function login(){one('#screen').innerHTML='<div class="login"><div class="eyebrow">SEU CRAFT PRIVADO</div><h1>Um atlas feito das suas notas.</h1><p class="muted">O código de acesso protege os dados do Craft. A conexão API permanece apenas no servidor.</p><div class="panel"><label>Chave de acesso</label><input class="field" id="password" type="password" autocomplete="current-password" placeholder="Cole seu código"><button id="enter" class="btn primary" style="width:100%">Entrar</button><p id="error" class="muted"></p></div></div>';one('#enter').onclick=async()=>{try{await api('login',{}, {password:one('#password').value});st.auth=true;await sync();go('home')}catch(e){one('#error').textContent=e.message}};one('#password').onkeydown=e=>{if(e.key==='Enter')one('#enter').click()}}
function render(){one('#logout').classList.toggle('hide',!st.auth);if(!st.auth)return login();if(st.tab==='home')home();else if(st.tab==='library')library();else if(st.tab==='reader')reader();else if(st.tab==='map')map();else studio()}
async function sync(){try{let [d,c]=await Promise.all([api('documents'),api('connection')]);st.docs=list(d);st.info=c;render();toast(st.docs.length+' notas carregadas')}catch(e){toast(e.message)}}
async function openDoc(id){if(!id)return;try{st.doc=await api('document',{id});st.id=id;st.mode='read';go('reader')}catch(e){toast(e.message)}}
one('#theme').onclick=()=>{document.body.classList.toggle('light');localStorage.setItem('atlas-theme',document.body.classList.contains('light')?'light':'dark')};if(localStorage.getItem('atlas-theme')==='light')document.body.classList.add('light');
one('#logout').onclick=async()=>{await api('logout');st.auth=false;go('home')};menu();(async()=>{try{st.auth=!!(await api('status')).authenticated;if(st.auth)await sync()}catch{}render()})();
</script></body></html>
