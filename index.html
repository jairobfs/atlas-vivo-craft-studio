<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071923">
  <meta name="description" content="ATLAS VIVO: experiência de estudo editorial, científica e visual, com o Craft como editor nativo.">
  <title>ATLAS VIVO · ColorHub × Craft Studio</title>
  <link rel="stylesheet" href="/visual.css">
  <link rel="stylesheet" href="/composer.css">
  <link rel="stylesheet" href="/visual-composer.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div>
        <div class="logo">ATLAS <strong>VIVO</strong></div>
        <div class="tagline">ColorHub × Craft Studio</div>
      </div>
      <nav class="nav nav-target" aria-label="Navegação principal"></nav>
      <div class="sidebar-footer">
        <div class="eyebrow">CONTEÚDO VIVO</div>
        <p>Edite no Craft. Estude visualmente. Aprimore o código no GitHub.</p>
        <p>Proveniência, editabilidade e atualização sem recriar documentos.</p>
      </div>
    </aside>
    <main class="main">
      <div class="topbar">
        <span id="crumb" class="mini muted">ATLAS VIVO / Painel</span>
        <div class="topactions">
          <button id="theme" class="btn icon" aria-label="Alternar aparência">◐</button>
          <button id="logout" class="btn small outline hide">Sair</button>
        </div>
      </div>
      <div id="screen"></div>
    </main>
  </div>
  <nav class="mobile-nav nav-target" aria-label="Navegação móvel"></nav>
  <div id="toast" role="status" class="hide"></div>
  <script type="module" src="/visual-app.js"></script>
</body>
</html>
